<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Estética Automotiva</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background-color: #0f172a; color: #f8fafc;" class="font-sans antialiased">

    <!-- Container Principal do Aplicativo -->
    <div id="app" class="flex h-screen overflow-hidden">
        
        <!-- Menu Lateral (Sidebar) -->
        <aside style="background-color: #1e293b; border-color: #334155;" class="w-64 border-r hidden md:flex flex-col">
            <div style="border-color: #334155; color: #38bdf8;" class="p-5 font-bold text-xl border-b">
                Estética Auto
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" style="background-color: #2563eb; color: #ffffff;" class="block px-4 py-2 rounded font-medium">Início</a>
                <a href="#" style="color: #cbd5e1;" class="block px-4 py-2 rounded hover:bg-slate-700">Produtos & Diluição</a>
                <a href="#" style="color: #cbd5e1;" class="block px-4 py-2 rounded hover:bg-slate-700">Serviços & Custos</a>
            </nav>
        </aside>

        <!-- Área de Conteúdo Principal -->
        <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            
            <!-- Cabeçalho Superior -->
            <header style="background-color: #1e293b; border-color: #334155;" class="border-b p-4 flex justify-between items-center">
                <h1 class="text-lg font-semibold">Painel de Controlo</h1>
                <span style="color: #94a3b8;" class="text-sm">Utilizador: Programador</span>
            </header>

            <!-- Conteúdo Dinâmico / Cards Flutuantes -->
            <main class="p-6 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Card Flutuante 1 -->
                    <div style="background-color: #1e293b; border-color: #334155;" class="p-5 rounded-xl border shadow-lg">
                        <h2 style="color: #94a3b8;" class="text-sm font-medium">Serviços Realizados</h2>
                        <p style="color: #38bdf8;" class="text-2xl font-bold mt-2">0</p>
                    </div>
                    <!-- Card Flutuante 2 -->
                    <div style="background-color: #1e293b; border-color: #334155;" class="p-5 rounded-xl border shadow-lg">
                        <h2 style="color: #94a3b8;" class="text-sm font-medium">Custo Total Produtos</h2>
                        <p style="color: #34d399;" class="text-2xl font-bold mt-2">R$ 0,00</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
