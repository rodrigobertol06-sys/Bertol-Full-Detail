<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estética Automotiva - Gestão</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background-color: #0f172a; color: #f8fafc;" class="font-sans antialiased">

    <!-- Container Principal -->
    <div class="flex h-screen overflow-hidden">
        
        <!-- Menu Lateral com o Padrão Visual -->
        <aside style="background-color: #1e293b; border-color: #334155;" class="w-64 border-r hidden md:flex flex-col">
            <div style="border-color: #334155; color: #38bdf8;" class="p-5 font-bold text-xl border-b flex items-center gap-2">
                <span>🚗</span> Estética Auto
            </div>
            <nav class="flex-1 p-4 space-y-2 text-sm">
                <a href="#" style="background-color: #2563eb; color: #ffffff;" class="block px-4 py-2 rounded-lg font-medium shadow-sm">Início</a>
                <a href="#" style="color: #cbd5e1;" class="block px-4 py-2 rounded-lg hover:bg-slate-800 transition">Produtos & Diluição</a>
                <a href="#" style="color: #cbd5e1;" class="block px-4 py-2 rounded-lg hover:bg-slate-800 transition">Serviços & Custos</a>
            </nav>
        </aside>

        <!-- Área de Conteúdo -->
        <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            
            <!-- Header Superior -->
            <header style="background-color: #1e293b; border-color: #334155;" class="border-b p-4 flex justify-between items-center shadow-sm">
                <h1 class="text-base font-semibold text-slate-200">Painel Operacional</h1>
                <span style="color: #94a3b8;" class="text-xs bg-slate-800 px-3 py-1 rounded-full border border-slate-700">Sessão Ativa</span>
            </header>

            <!-- Conteúdo Principal / Cards no Padrão do Template -->
            <main class="p-6 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    
                    <!-- Card 1: Produtos Cadastrados -->
                    <div style="background-color: #1e293b; border-color: #334155;" class="p-5 rounded-2xl border shadow-sm flex flex-col justify-between">
                        <div>
                            <span style="color: #38bdf8;" class="text-xs font-bold uppercase tracking-wider">Inventário</span>
                            <p class="text-3xl font-bold mt-2 text-slate-100">0</p>
                        </div>
                        <span class="text-xs text-slate-400 mt-4">Produtos no sistema</span>
                    </div>

                    <!-- Card 2: Custo Operacional -->
                    <div style="background-color: #1e293b; border-color: #334155;" class="p-5 rounded-2xl border shadow-sm flex flex-col justify-between">
                        <div>
                            <span style="color: #34d399;" class="text-xs font-bold uppercase tracking-wider">Financeiro</span>
                            <p class="text-3xl font-bold mt-2 text-slate-100">R$ 0,00</p>
                        </div>
                        <span class="text-xs text-slate-400 mt-4">Custos base calculados</span>
                    </div>

                </div>
            </main>
        </div>
    </div>

</body>
</html>
