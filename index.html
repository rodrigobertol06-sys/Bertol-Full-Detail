<!-- 005. Estrutura HTML principal da aplicação -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbonera & Tomazini - Controle de Vendas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="flex flex-col h-screen overflow-hidden bg-slate-50 font-sans">

    <!-- 006. Cabeçalho da aplicação -->
    <header style="background-color: #300c07; color: #ffffff;" class="shrink-0 z-40 shadow">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-xs md:text-sm font-bold tracking-wide">Carbonera & Tomazini</span>
            </div>
            <div class="flex items-center gap-2">
                <span id="info-usuario-logado" class="text-xs text-slate-300 hidden md:inline"></span>
                <button onclick="carregarDadosPlanilha()" class="text-xs font-semibold px-3 py-2 rounded-lg text-white" style="background-color: #4a130b;">
                    <i class="fa-solid fa-rotate mr-1.5"></i> Sincronizar
                </button>
                <button onclick="abrirModalLogin()" class="text-sm font-semibold px-4 py-2 rounded-lg text-white" style="background-color: #4a130b;">
                    <i class="fa-solid fa-lock mr-2"></i> <span id="texto-botao-login">Entrar</span>
                </button>
            </div>
        </div>
    </header>

   <!-- 007. Modal de Login (Com suporte a tecla Enter) -->
    <div id="modal-login" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4 mx-4 border border-slate-200">
            <h3 class="font-bold text-base" style="color: #300c07;">Identificação de Acesso</h3>
            
            <!-- Adicionado o evento onkeydown para disparar com Enter -->
            <input type="text" id="usuario-input" placeholder="Nome de Usuário" 
                   onkeydown="if(event.key === 'Enter') realizarLogin()" 
                   class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-xs focus:outline-none focus:border-[#300c07]">
            
            <!-- Adicionado o evento onkeydown para disparar com Enter -->
            <input type="password" id="senha-input" placeholder="Sua senha" 
                   onkeydown="if(event.key === 'Enter') realizarLogin()" 
                   class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-xs focus:outline-none focus:border-[#300c07]">
            
            <button onclick="realizarLogin()" class="w-full py-3 text-white text-xs font-bold rounded-xl shadow-md" style="background-color: #300c07;">Entrar no Sistema</button>
        </div>
    </div>

    <!-- 008. Container Principal -->
    <main class="p-6 space-y-6 max-w-7xl w-full mx-auto overflow-y-auto flex-grow">
        <div id="secao-setores-container" class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm hidden">
            <span class="text-xs font-bold text-slate-500 uppercase">Setores Disponíveis (Master)</span>
            <div id="cards-setores-grid" class="grid grid-cols-1 sm:grid-cols-4 gap-3 mt-2"></div>
        </div>

        <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
            <h3 id="titulo-painel-dados" class="font-bold text-sm" style="color: #300c07;">Dados Sincronizados</h3>
            <div class="overflow-x-auto max-h-[400px] border border-slate-200 rounded-xl">
                <table class="w-full text-left text-xs border-collapse">
                    <thead id="tabela-cabecalho" class="bg-slate-50 text-slate-700 sticky top-0 border-b border-slate-200"></thead>
                    <tbody id="tabela-corpo" class="divide-y divide-slate-200">
                        <tr><td colspan="10" class="p-4 text-center text-slate-500">Faça o login para carregar os dados.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- 009. Importação dos Módulos JS Separados -->
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
</body>
</html>
